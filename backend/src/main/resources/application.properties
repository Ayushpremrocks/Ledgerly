# Application Name
spring.application.name=ledgerly-backend

# Server Port (Render provides PORT env variable)
server.port=${PORT:8080}

# Database Configuration (Use environment variables)
# Works with Neon Postgres or MySQL. The JDBC driver is picked from the URL and
# the Hibernate dialect is detected from the live connection.
# - Neon: run via `npx neon-env run -- mvn spring-boot:run` (or set DATABASE_URL /
#   DATABASE_URL_UNPOOLED to a postgresql:// URL). NeonDatabaseUrlProcessor turns it
#   into the JDBC url + username + password below.
# - MySQL: leave those unset to use the local default, or set a jdbc:mysql:// URL.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/banking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration (Use environment variable in production!)
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-change-this-in-production-environment-very-important-security}
jwt.expiration=86400000

# XML Storage Path
xml.storage.path=xml-storage/transactions/

# Email Configuration (Configure via environment variables)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging Level (reduce in production)
logging.level.com.bankapp=INFO
logging.level.org.springframework.security=WARN

# CORS Configuration
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# First admin user: created on startup only if ADMIN_PASSWORD is set
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:admin@ledgerly.local}

# Money rules (INR)
app.limits.min-amount=1.00
app.limits.max-per-transaction=100000
app.limits.daily-transfer=200000
app.limits.max-deposit=100000
app.limits.max-accounts=5

# Sign-in protection: lock for N minutes after this many wrong passwords in a row
app.security.max-failed-logins=5
app.security.lock-minutes=15
